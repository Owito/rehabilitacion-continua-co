name: Actualizar oferta (diaria)

on:
  schedule:
    # Todos los días 11:17 UTC = 6:17 AM hora Colombia (UTC-5).
    # Minuto fuera de la hora en punto: GitHub encola los cron de las :00 con el resto del
    # mundo y entre el 27-ago y el 11-sep de 2026 este run llegó entre 2,5 y 10 horas tarde.
    - cron: '17 11 * * *'
  workflow_dispatch: # permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write   # para commitear cursos.json
  actions: write    # para disparar el workflow de deploy tras commitear
  # Ya no se pide `models: read`: GitHub Models se retiró (HTTP 410) y la extracción
  # ahora usa la API de Groq con el secreto GROQ_API_KEY.

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Ejecutar actualización
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/actualizar-cursos.mjs

      - name: Commit y disparar deploy si hubo cambios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Solo se commitea si cambió la OFERTA (programas, meses, ventana). La línea
          # "actualizado" cambia todos los días por definición y sola no justifica un
          # commit ni un deploy: entre el 18-ago y el 11-sep de 2026 hubo 25 commits y 25
          # deploys que no cambiaban nada más que esa fecha.
          if ! git diff --quiet -I '"actualizado":' -- src/data/cursos.json; then
            git add src/data/cursos.json
            git commit -m "chore: actualización automática diaria de la oferta"
            git push
            # El push con GITHUB_TOKEN no dispara otros workflows, así que el deploy
            # se lanza explícitamente aquí.
            gh workflow run deploy.yml --ref main
            echo "Cambios commiteados y deploy disparado."
          else
            git checkout -- src/data/cursos.json
            echo "Sin cambios en la oferta hoy (solo la fecha de ejecución)."
          fi
